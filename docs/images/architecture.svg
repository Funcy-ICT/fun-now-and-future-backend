<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- 背景。GitHubのダークモードでも読めるよう、白で塗る -->
  <rect x="0" y="0" width="1400" height="790" fill="#ffffff"/>

  <!-- 呼び出す側 -->
  <g id="esp32">
    <rect x="30" y="60" width="210" height="70" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
    <text x="135" y="90" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">ESP32（ノード）</text>
    <text x="135" y="112" font-size="12" text-anchor="middle" fill="#495057">1分ごとに検出結果を送る</text>
  </g>
  <g id="signage">
    <rect x="30" y="170" width="210" height="70" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
    <text x="135" y="200" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">サイネージ</text>
    <text x="135" y="222" font-size="12" text-anchor="middle" fill="#495057">ブラウザ（React）</text>
  </g>
  <g id="storage">
    <rect x="30" y="300" width="210" height="80" rx="8" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="135" y="330" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">Cloud Storage</text>
    <text x="135" y="352" font-size="12" text-anchor="middle" fill="#495057">公開バケット</text>
    <text x="135" y="369" font-size="12" text-anchor="middle" fill="#495057">広報の画像・PDF</text>
  </g>
  <g id="admin">
    <rect x="30" y="430" width="210" height="90" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="135" y="460" font-size="15" font-weight="bold" text-anchor="middle" fill="#495057">管理画面（admin/）</text>
    <text x="135" y="482" font-size="12" text-anchor="middle" fill="#868e96">未実装</text>
    <text x="135" y="499" font-size="12" text-anchor="middle" fill="#868e96">Cloudflare Access の</text>
    <text x="135" y="515" font-size="12" text-anchor="middle" fill="#868e96">後ろに置く予定</text>
  </g>
  <g id="scheduler">
    <rect x="30" y="590" width="210" height="120" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
    <text x="135" y="617" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">Cloud Scheduler</text>
    <text x="228" y="645" font-size="12" text-anchor="end" fill="#495057">5分ごと</text>
    <text x="228" y="695" font-size="12" text-anchor="end" fill="#495057">毎日 04:00</text>
  </g>

  <!-- Cloud Run -->
  <g id="ingest">
    <rect x="320" y="40" width="320" height="210" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="336" y="66" font-size="16" font-weight="bold" fill="#212529">ingest</text>
    <text x="624" y="66" font-size="12" text-anchor="end" fill="#1864ab">Cloud Run・公開</text>
    <text x="336" y="100" font-size="13" fill="#212529">POST /receiveSensorData</text>
    <text x="336" y="118" font-size="11" fill="#495057">検証し、MAC を HMAC にして publish</text>
    <text x="336" y="160" font-size="13" fill="#212529">GET /getCongestion</text>
    <text x="336" y="182" font-size="13" fill="#212529">GET /getCongestionHistory</text>
    <text x="336" y="204" font-size="13" fill="#212529">GET /signage/assets</text>
    <text x="336" y="232" font-size="11" fill="#495057">/doc、/ui（Swagger）、/health</text>
  </g>
  <g id="worker">
    <rect x="320" y="530" width="320" height="190" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="336" y="556" font-size="16" font-weight="bold" fill="#212529">worker</text>
    <text x="624" y="556" font-size="12" text-anchor="end" fill="#1864ab">Cloud Run・認証必須</text>
    <text x="336" y="594" font-size="13" fill="#212529">POST /pubsub/scan-events</text>
    <text x="336" y="612" font-size="11" fill="#495057">pending_scans に保存する</text>
    <text x="336" y="644" font-size="13" fill="#212529">POST /aggregate</text>
    <text x="336" y="662" font-size="11" fill="#495057">5分の窓ごとに、location の台数を数える</text>
    <text x="336" y="694" font-size="13" fill="#212529">POST /internal/batch/calc-max-device</text>
    <text x="336" y="712" font-size="11" fill="#495057">基準値（max_devices）を計算する</text>
  </g>

  <!-- Firestore -->
  <g id="firestore">
    <rect x="320" y="300" width="320" height="185" rx="8" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="336" y="325" font-size="16" font-weight="bold" fill="#212529">Firestore</text>
    <g font-size="12">
      <text x="336" y="349" font-weight="bold" fill="#2b8a3e">表示に使う</text>
      <text x="416" y="349" fill="#212529">congestion_records,</text>
      <text x="416" y="366" fill="#212529">max_devices, prAssets</text>
      <text x="336" y="390" font-weight="bold" fill="#2b8a3e">集計の途中</text>
      <text x="416" y="390" fill="#212529">pending_scans, daily_summaries,</text>
      <text x="416" y="407" fill="#212529">excluded_records</text>
      <text x="336" y="431" font-weight="bold" fill="#2b8a3e">監視・診断</text>
      <text x="416" y="431" fill="#212529">node_health_stats,</text>
      <text x="416" y="448" fill="#212529">scan_diagnostics</text>
      <text x="336" y="472" font-weight="bold" fill="#2b8a3e">設定</text>
      <text x="416" y="472" fill="#212529">config/*</text>
    </g>
  </g>

  <!-- Pub/Sub -->
  <g id="topic-scan-events">
    <rect x="740" y="65" width="220" height="75" rx="8" fill="#fff4e6" stroke="#f76707" stroke-width="1.5"/>
    <text x="850" y="93" font-size="13" text-anchor="middle" fill="#d9480f">Pub/Sub トピック</text>
    <text x="850" y="117" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">scan-events</text>
  </g>
  <g id="topic-aggregate-runs">
    <rect x="740" y="655" width="220" height="70" rx="8" fill="#fff4e6" stroke="#f76707" stroke-width="1.5"/>
    <text x="850" y="682" font-size="13" text-anchor="middle" fill="#d9480f">Pub/Sub トピック</text>
    <text x="850" y="705" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">aggregate-runs</text>
  </g>

  <!-- BigQuery -->
  <g id="bigquery">
    <rect x="1100" y="40" width="270" height="690" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="1116" y="30" font-size="16" font-weight="bold" fill="#212529">BigQuery（東京）</text>
    <rect x="1120" y="62" width="230" height="100" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="1134" y="88" font-size="15" font-weight="bold" fill="#212529">scan_events</text>
    <text x="1134" y="110" font-size="12" fill="#495057">生データ（MAC はハッシュ値）</text>
    <text x="1134" y="128" font-size="12" fill="#495057">保持期間は config/retention</text>
    <text x="1134" y="146" font-size="12" fill="#495057">受信した日でパーティション</text>
    <text x="1235" y="380" font-size="12" text-anchor="middle" fill="#495057">分析用の SQL で、</text>
    <text x="1235" y="398" font-size="12" text-anchor="middle" fill="#495057">設定を変えて数え直せる</text>
    <text x="1235" y="416" font-size="12" text-anchor="middle" fill="#868e96">（設定変更時の再計算は未実装）</text>
    <rect x="1120" y="640" width="230" height="75" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="1134" y="666" font-size="15" font-weight="bold" fill="#212529">aggregate_runs</text>
    <text x="1134" y="688" font-size="12" fill="#495057">集計の履歴</text>
    <text x="1134" y="705" font-size="12" fill="#495057">台数、各段の通過数、設定</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="95" x2="318" y2="95"/>
    <line x1="240" y1="205" x2="318" y2="205"/>
    <line x1="135" y1="240" x2="135" y2="298"/>
    <line x1="640" y1="100" x2="738" y2="100"/>
    <line x1="960" y1="102" x2="1118" y2="102"/>
    <path d="M850 140 V590 H642"/>
    <line x1="480" y1="250" x2="480" y2="298"/>
    <line x1="480" y1="530" x2="480" y2="487"/>
    <line x1="240" y1="640" x2="318" y2="640"/>
    <line x1="240" y1="690" x2="318" y2="690"/>
    <line x1="640" y1="690" x2="738" y2="690"/>
    <line x1="960" y1="690" x2="1118" y2="690"/>
  </g>

  <!-- 矢印の説明 -->
  <g font-size="11" fill="#495057">
    <text x="279" y="88" text-anchor="middle">x-api-key</text>
    <text x="279" y="198" text-anchor="middle">x-api-key</text>
    <text x="143" y="274">直接読む</text>
    <text x="689" y="92" text-anchor="middle">publish</text>
    <text x="1030" y="82" text-anchor="middle">BigQuery</text>
    <text x="1030" y="95" text-anchor="middle">サブスクリプション</text>
    <text x="860" y="360">プッシュ（OIDC）</text>
    <text x="490" y="279">読む</text>
    <text x="490" y="513">書く</text>
    <text x="279" y="633" text-anchor="middle">OIDC</text>
    <text x="279" y="683" text-anchor="middle">OIDC</text>
    <text x="689" y="682" text-anchor="middle">publish</text>
  </g>

  <!-- 凡例 -->
  <g font-size="12" fill="#495057">
    <text x="30" y="760">破線の枠は未実装。worker は Cloud Run の IAM で、Pub/Sub と Cloud Scheduler のサービスアカウントだけが呼べる。</text>
    <text x="30" y="778">生の MAC は ingest の中だけで扱い、Pub/Sub、BigQuery、Firestore には残らない。</text>
  </g>
</svg>
