name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Smoke test
        run: |
          node lib/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/health || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
          
      - run: npm test
